# Deegaanka horumarinta MAXALLIGA AH (local dev) kaliya. Ma aha production.
# Isticmaal:  make up     (wuxuu akhriyaa ../.env)
name: gurihel

services:
  db:
    image: postgis/postgis:16-3.4
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-gurihel}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Fadlan ku qor POSTGRES_PASSWORD .env (make init)}
      POSTGRES_DB: ${POSTGRES_DB:-gurihel}
    ports:
      - "127.0.0.1:5432:5432" # kaliya localhost — ha u furin shabakadda
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-gurihel} -d $${POSTGRES_DB:-gurihel}"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?Fadlan ku qor REDIS_PASSWORD .env (make init)}", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" --no-auth-warning ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 20
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Fadlan ku qor MINIO_ROOT_USER .env (make init)}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Fadlan ku qor MINIO_ROOT_PASSWORD .env (make init)}
    ports:
      - "127.0.0.1:9000:9000" # S3 API
      - "127.0.0.1:9001:9001" # Console
    volumes:
      - miniodata:/data

volumes:
  pgdata:
  redisdata:
  miniodata:
